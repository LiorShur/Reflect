name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck / lint / test / rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java (firebase emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install root + workspaces
        run: npm ci

      - name: Install firebase-tools
        run: npm install -g firebase-tools@^13.0.0

      - name: Typecheck (root projects: functions + eval)
        run: npm run typecheck

      - name: Typecheck (mobile)
        run: npm --prefix mobile run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (functions, including moderator fast-path)
        run: npm test

      - name: Rules tests (against database emulator)
        run: npm run rules:test
